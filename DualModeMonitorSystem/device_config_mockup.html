<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备配置</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #1E222B;
            color: #E5E7EB;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            height: 90vh;
        }
        .device-list {
            width: 300px;
            border-right: 1px solid #374151;
            padding-right: 20px;
            overflow-y: auto;
        }
        .device-item {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .device-item.active {
            background-color: #374151;
        }
        .device-item:hover {
            background-color: #272E3B;
        }
        .device-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .status-online { background-color: #52C41A; }
        .status-offline { background-color: #9CA3AF; }
        .status-alert { background-color: #F59E0B; }
        .config-details {
            flex-grow: 1;
            padding-left: 20px;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #374151;
            margin-bottom: 20px;
        }
        .tab-item {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab-item.active {
            color: #165DFF;
            border-bottom-color: #165DFF;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #4B5563;
            background-color: #272E3B;
            color: #E5E7EB;
        }
        .data-points-table {
            width: 100%;
            border-collapse: collapse;
        }
        .data-points-table th, .data-points-table td {
            padding: 10px;
            border: 1px solid #374151;
            text-align: left;
        }
        .data-points-table th {
            background-color: #272E3B;
        }
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-primary {
            background-color: #165DFF;
            color: white;
        }
        .btn-secondary {
            background-color: #4B5563;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="device-list">
            <h2>设备列表</h2>
            <div class="device-item active">
                <div>
                    <span class="device-status status-online"></span>
                    <span>温度传感器 #1</span>
                </div>
                <span>车间 A</span>
            </div>
            <div class="device-item">
                <div>
                    <span class="device-status status-offline"></span>
                    <span>湿度传感器 #1</span>
                </div>
                <span>车间 A</span>
            </div>
            <div class="device-item">
                <div>
                    <span class="device-status status-alert"></span>
                    <span>压力传感器 #1</span>
                </div>
                <span>车间 B</span>
            </div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 10px;">+ 添加设备</button>
        </div>
        <div class="config-details">
            <div class="tabs">
                <div class="tab-item active">常规</div>
                <div class="tab-item">串口</div>
                <div class="tab-item">Modbus 数据点</div>
            </div>
            <div class="tab-content active">
                <h3>常规设置</h3>
                <div class="form-group">
                    <label for="device-name">设备名称</label>
                    <input type="text" id="device-name" value="温度传感器 #1">
                </div>
                <div class="form-group">
                    <label for="device-location">位置</label>
                    <input type="text" id="device-location" value="车间 A">
                </div>
                <div class="form-group">
                    <label for="device-desc">描述</label>
                    <input type="text" id="device-desc" value="测量1号生产线的温度">
                </div>
            </div>
            <div class="tab-content">
                <h3>串口配置</h3>
                <div class="form-group">
                    <label for="serial-port">串口</label>
                    <select id="serial-port">
                        <option>COM1</option>
                        <option selected>COM2</option>
                        <option>COM3</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="baud-rate">波特率</label>
                    <select id="baud-rate">
                        <option>9600</option>
                        <option selected>19200</option>
                        <option>115200</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="data-bits">数据位</label>
                    <select id="data-bits">
                        <option>7</option>
                        <option selected>8</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="stop-bits">停止位</label>
                    <select id="stop-bits">
                        <option selected>1</option>
                        <option>2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="parity">校验位</label>
                    <select id="parity">
                        <option selected>None</option>
                        <option>Odd</option>
                        <option>Even</option>
                    </select>
                </div>
            </div>
            <div class="tab-content">
                <h3>Modbus 数据点</h3>
                <button class="btn btn-primary" style="margin-bottom: 10px;">+ 添加数据点</button>
                <table class="data-points-table">
                    <thead>
                        <tr>
                            <th>名称</th>
                            <th>寄存器地址</th>
                            <th>数据类型</th>
                            <th>功能码</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>当前温度</td>
                            <td>40001</td>
                            <td>Float</td>
                            <td>Read Holding Registers</td>
                            <td>
                                <button class="btn btn-secondary">编辑</button>
                                <button class="btn btn-secondary">删除</button>
                            </td>
                        </tr>
                        <tr>
                            <td>温度上限</td>
                            <td>40003</td>
                            <td>Float</td>
                            <td>Read/Write Holding Registers</td>
                            <td>
                                <button class="btn btn-secondary">编辑</button>
                                <button class="btn btn-secondary">删除</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
